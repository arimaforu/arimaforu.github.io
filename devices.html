<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>точка</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000; /* Чёрный фон */
        }

        .container {
            display: flex;
            justify-content: center; /* Центрирование по горизонтали */
            align-items: center;     /* Центрирование по вертикали */
            width: 100%;
            height: 100%;
        }

        .centered-photo {
            width: 735px;
            height: 687px;
            object-fit: cover;
            display: block;
        }

        @media (max-width: 750px) or (max-height: 700px) {
            .centered-photo {
                width: 90vw;  /* Ограничиваем по ширине экрана */
                height: auto; /* Сохраняем пропорции */
                max-height: 90vh;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ссылка обновлена на ваше изображение -->
        <img src="https://i.pinimg.com/736x/17/66/62/17666214b46470c69f4ad0b56303a96d.jpg" alt="точка" class="centered-photo">
    </div>

</body>
</html>
